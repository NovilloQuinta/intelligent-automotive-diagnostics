packages:
  - 'apps/*'

allowBuilds:
  '@scarf/scarf': set this to true or false
  bcrypt: set this to true or false
  better-sqlite3: set this to true or false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - '@scarf/scarf'
  - bcrypt
  - better-sqlite3
  - esbuild

overrides:
  protobufjs: '>=7.5.5'
