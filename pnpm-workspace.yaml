packages:
  - 'apps/*'

allowBuilds:
  '@scarf/scarf': false
  '@serialport/bindings-cpp': true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  png-img: false
  protobufjs: true
  sharp: true
  wd: false

onlyBuiltDependencies:
  - '@scarf/scarf'
  - bcrypt
  - better-sqlite3
  - esbuild

overrides:
  protobufjs: '>=7.5.5'
  handlebars: '>=4.7.7'
  uglify-js: '>=3.18.0'
  form-data: '>=2.5.4'
  sharp: '>=0.35.0'
  fast-uri: '>=3.1.5'
  ip-address: '>=10.3.1'
  # (Sin override de brace-expansion: el ReDoS GHSA-v6h2-p8h4-qcjw ya está
  # parcheado en cada línea mayor — 1.1.12+, 2.0.2+, etc. — y cada consumidor
  # (minimatch@3, minimatch@9/10...) resuelve de forma natural su propia
  # versión parcheada compatible. Forzar todo a la v5 rompía a minimatch@3,
  # que pide ^1.1.7 y espera la forma de módulo CJS de la v1: "expand is not
  # a function" en tiempo de ejecución.)
  png-img: '>=3.1.0'
  node-fetch: '>=2.6.7'
  braces: '>=3.0.3'
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  postcss: '>=8.5.23'
