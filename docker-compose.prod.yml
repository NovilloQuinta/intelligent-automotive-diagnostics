name: intelligent-automotive-diagnostics

# `IMAGE_TAG` fija que version corre. Lo escribe el despliegue en el `.env` de
# este directorio con el SHA del commit, y `latest` queda solo como red por si
# alguien levanta el stack a mano.
#
# **Volver atras** = poner en `.env` el SHA anterior y `docker compose up -d`.
# Por eso el despliegue ya no borra todas las imagenes sin usar: sin la anterior
# en disco no hay marcha atras.

services:
  elm327-audi:
    image: ghcr.io/novilloquinta/intelligent-automotive-diagnostics/elm327:${IMAGE_TAG:-latest}
    environment:
      - SCENARIO_SCRIPT=run_audi.py
    restart: unless-stopped

  elm327-kawasaki:
    image: ghcr.io/novilloquinta/intelligent-automotive-diagnostics/elm327:${IMAGE_TAG:-latest}
    environment:
      - SCENARIO_SCRIPT=run_kawasaki.py
    restart: unless-stopped

  elm327-toyota:
    image: ghcr.io/novilloquinta/intelligent-automotive-diagnostics/elm327:${IMAGE_TAG:-latest}
    environment:
      - SCENARIO_SCRIPT=run_toyota.py
    restart: unless-stopped

  api:
    image: ghcr.io/novilloquinta/intelligent-automotive-diagnostics/api:${IMAGE_TAG:-latest}
    ports:
      # Solo loopback: Caddy corre en el host y llega por localhost:4000.
      # Publicarlo en 0.0.0.0 dejaria la API accesible saltandose el proxy,
      # y con `trust proxy` el cliente pondria su propio X-Forwarded-For:
      # rate limit por IP inutil y log de auditoria envenenable.
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/diagnostics.db
      - LANCEDB_PATH=/app/data/lancedb
      - OBD_MODE=${OBD_MODE:-docker}
      - ELM327_AUDI_HOST=elm327-audi
      - ELM327_AUDI_PORT=35000
      - ELM327_KAWASAKI_HOST=elm327-kawasaki
      - ELM327_KAWASAKI_PORT=35001
      - ELM327_TOYOTA_HOST=elm327-toyota
      - ELM327_TOYOTA_PORT=35002
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY is required}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-900}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-604800}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://diag.jcodinglabs.com}
      - APP_BASE_URL=${APP_BASE_URL:-https://diag.jcodinglabs.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@jcodinglabs.com}
    volumes:
      - api-data:/app/data
    restart: unless-stopped
    depends_on:
      elm327-audi:
        condition: service_started
      elm327-kawasaki:
        condition: service_started
      elm327-toyota:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ui:
    image: ghcr.io/novilloquinta/intelligent-automotive-diagnostics/ui:${IMAGE_TAG:-latest}
    ports:
      # Solo loopback: quien sirve al exterior es Caddy, en el mismo host.
      - "127.0.0.1:${UI_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  api-data:
