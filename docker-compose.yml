services:
  elm327-audi:
    build:
      context: .
      dockerfile: docker/elm327/Dockerfile
    environment:
      - SCENARIO_SCRIPT=run_audi.py
    ports:
      - "35000:35000"
    restart: unless-stopped

  elm327-kawasaki:
    build:
      context: .
      dockerfile: docker/elm327/Dockerfile
    environment:
      - SCENARIO_SCRIPT=run_kawasaki.py
    ports:
      - "35001:35001"
    restart: unless-stopped

  elm327-toyota:
    build:
      context: .
      dockerfile: docker/elm327/Dockerfile
    environment:
      - SCENARIO_SCRIPT=run_toyota.py
    ports:
      - "35002:35002"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      # La API se niega a arrancar en produccion sin esta clave (cifra el
      # secreto TOTP del 2FA, AES-256-GCM): openssl rand -base64 32.
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - OBD_MODE=${OBD_MODE:-docker}
      - ELM327_AUDI_HOST=elm327-audi
      - ELM327_AUDI_PORT=35000
      - ELM327_KAWASAKI_HOST=elm327-kawasaki
      - ELM327_KAWASAKI_PORT=35001
      - ELM327_TOYOTA_HOST=elm327-toyota
      - ELM327_TOYOTA_PORT=35002
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WEB_SEARCH_API_KEY=${WEB_SEARCH_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@jcodinglabs.com}
    volumes:
      - api-data:/app/data
    restart: unless-stopped

volumes:
  api-data:
