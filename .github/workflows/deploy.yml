name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/novilloquinta/intelligent-automotive-diagnostics

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: elm327
            dockerfile: docker/elm327/Dockerfile
          - name: api
            dockerfile: apps/core-api/Dockerfile
          - name: ui
            dockerfile: apps/ui/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build-push.result == 'success' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/opt/intelligent-automotive-diagnostics
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR" ]; then
              echo ">>> Clonando repo en $APP_DIR..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo ">>> Pulling latest..."
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout main
            git pull origin main

            echo ">>> Logging in to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo ">>> Pulling images..."
            docker compose -f docker-compose.prod.yml pull

            echo ">>> Deploying..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo ">>> Pruning old images..."
            docker image prune -af

            echo ">>> Status:"
            docker compose -f docker-compose.prod.yml ps
