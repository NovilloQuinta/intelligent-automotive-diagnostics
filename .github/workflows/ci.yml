name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Las dos apps corren la suite CON cobertura, que es la misma pasada
        # instrumentada —no una segunda— y hace que los umbrales `perFile` de
        # cada `vitest.config.ts` fallen el CI. Antes no los miraba nadie:
        # `pnpm test:coverage` se rompio en `develop` durante dias sin que
        # ningun gate se enterara, y la cobertura de la UI llevaba mas tiempo
        # rota sin estar siquiera anotada.
        #
        # Se declara por app en vez de fijarlo en el step porque el comando es
        # lo unico que puede divergir entre las dos: si alguna vez hay que
        # sacar una del gate, se ve aqui y no escondido en un `if`.
        include:
          - app: core-api
            test: test:coverage
          - app: ui
            test: test:coverage

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - run: pnpm lint

      - run: pnpm format

      - run: pnpm ${{ matrix.test }}

      - run: pnpm build

      # Despues de build a proposito: en la UI, src/routeTree.gen.ts lo genera
      # el plugin de router durante el build y esta gitignored, asi que en un
      # clon limpio tsc no compila hasta que build lo ha creado.
      # `vite build` transpila pero NO typechequea: sin este paso, un error de
      # tipos en apps/ui pasa el CI sin que nadie se entere.
      - run: pnpm typecheck

      - name: Audit
        run: pnpm audit --audit-level=critical
        working-directory: .

  # Recorridos de punta a punta con navegador real. Van en un job aparte y no en
  # la matriz de arriba porque necesitan las DOS apps levantadas a la vez, y esa
  # matriz corre una por trabajo con `working-directory` fijo.
  #
  # Este job existe porque un bug de login paso los 643 tests unitarios de la UI,
  # `pnpm verify` y el CI entero: el mock del test describia una respuesta que el
  # servidor no manda. Solo lo vio un navegador de verdad.
  #
  # Cubre las cuatro suites, `dashboard.spec.ts` incluida. Esos seis casos pedian
  # los tres emuladores ELM327, que este job levanta con compose antes de correr:
  # el `core-api` que arranca Playwright los busca en localhost:35000-35002, que
  # es justo lo que trae por defecto `configuration/index.ts`, asi que no hace
  # falta pasarle nada.
  e2e:
    name: e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Solo Chromium: es el unico proyecto declarado en playwright.config.ts, y
      # bajar los tres navegadores triplicaria el tiempo sin cubrir nada mas.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/ui

      # Solo los tres emuladores: el servicio `api` del compose pide secretos que
      # aqui no hacen falta, porque el core-api lo arranca Playwright.
      - name: Start ELM327 emulators
        run: docker compose up -d --build elm327-audi elm327-kawasaki elm327-toyota

      # `compose up -d` vuelve cuando el contenedor arranca, no cuando el emulador
      # escucha: el interprete de Python tarda unos segundos mas. Sin esta espera,
      # el primer diagnostico del dashboard sale con ECONNREFUSED de forma
      # intermitente, que es la peor manera de fallar.
      - name: Wait for emulators
        run: |
          for port in 35000 35001 35002; do
            for attempt in $(seq 1 30); do
              if nc -z localhost "$port"; then
                echo "emulador en $port listo"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "::error::el emulador de $port no respondio en 30 s"
                docker compose logs
                exit 1
              fi
              sleep 1
            done
          done

      # `playwright.config.ts` levanta core-api y Vite por su cuenta (webServer).
      - name: Run e2e
        run: pnpm test:e2e
        working-directory: apps/ui

      # El informe de Playwright dice que fallo en el navegador; si la causa esta
      # en el bus, esta del lado del emulador y solo se ve aqui.
      - name: Emulator logs on failure
        if: failure()
        run: docker compose logs elm327-audi elm327-kawasaki elm327-toyota

      # Sin esto, un fallo en CI deja solo el texto del error: el informe lleva la
      # captura del momento exacto, que es lo que hace falta para diagnosticarlo.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 7

  # La SPA la sirve nginx dentro del contenedor de UI, asi que sus cabeceras de
  # seguridad no las ve ningun test de Vitest ni de Playwright: `webServer` de
  # Playwright levanta Vite, no la imagen. Sin este job, borrar el `add_header`
  # pasa CI entero y el fallo se descubre en produccion.
  #
  # No construye la imagen de UI (varios minutos): monta las confs sobre
  # `nginx:alpine` con un `dist/` de mentira. Eso valida lo que puede fallar de
  # verdad — que nginx arranque con esta config y que emita las cabeceras.
  nginx:
    name: nginx headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fake dist
        run: |
          mkdir -p /tmp/dist/assets
          echo '<!DOCTYPE html><html><body>ok</body></html>' > /tmp/dist/index.html
          echo 'console.log(1)' > /tmp/dist/assets/app.js

      - name: Validate config
        run: |
          docker run --rm \
            -v "$PWD/apps/ui/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/apps/ui/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v /tmp/dist:/usr/share/nginx/html:ro \
            nginx:alpine nginx -t

      - name: Start nginx
        run: |
          docker run -d --name ui-nginx -p 8080:80 \
            -v "$PWD/apps/ui/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/apps/ui/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v /tmp/dist:/usr/share/nginx/html:ro \
            nginx:alpine
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "nginx no respondio"; docker logs ui-nginx; exit 1

      # Las dos rutas, no solo la raiz: `location /assets/` declara su propio
      # add_header, y nginx corta ahi la herencia del bloque padre.
      - name: Assert security headers
        run: |
          fail=0
          for path in / /assets/app.js; do
            headers=$(curl -sI "http://localhost:8080$path")
            for header in content-security-policy x-content-type-options referrer-policy; do
              if ! grep -qi "^$header:" <<< "$headers"; then
                echo "FALTA $header en $path"
                fail=1
              fi
            done
            if ! grep -qi "^content-security-policy:.*fonts\.googleapis\.com" <<< "$headers"; then
              echo "la CSP de $path no permite la hoja de Google Fonts que carga __root.tsx"
              fail=1
            fi
          done
          exit $fail

      - name: Stop nginx
        if: always()
        run: docker rm -f ui-nginx
