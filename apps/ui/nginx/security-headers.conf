# Cabeceras de seguridad de la SPA.
#
# Se incluye en el bloque `server` Y en cada `location` que declare un
# `add_header` propio: nginx deja de heredar las cabeceras del padre en cuanto
# el hijo anade la suya, asi que una sola inclusion arriba dejaria `/assets/`
# sin ellas.
#
# Vive en `snippets/` y no en `conf.d/` a proposito: nginx incluye
# `conf.d/*.conf` automaticamente en el contexto `http`, y este fichero acabaria
# aplicandose dos veces.

# CSP del documento HTML. Cada directiva, y por que:
#
#   script-src 'self'   El build de Vite no emite scripts inline — `dist/index.html`
#                       solo enlaza `/assets/*.js`. Sin 'unsafe-inline', que es
#                       donde la CSP de verdad sirve para algo.
#   style-src           'unsafe-inline' lo exigen los componentes de Radix, que
#                       posicionan popovers y dialogos con `style=""` en linea.
#                       fonts.googleapis.com sirve la hoja de estilos que carga
#                       `src/routes/__root.tsx`.
#   font-src            fonts.gstatic.com sirve los .woff2 que pide esa hoja.
#   connect-src 'self'  La API va bajo el mismo origen: Caddy enruta /api/* al
#                       contenedor de core-api, asi que la SPA nunca sale fuera.
#   img-src data:       El QR del segundo factor llega como data URI.
#
# La API tiene la suya, mas estricta (`default-src 'none'`, Helmet en
# `server.ts`). Esta cubre solo lo que sirve nginx.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Caddy pone estas dos delante, pero el contenedor tambien es alcanzable por su
# puerto publicado sin pasar por Caddy. Duplicarlas cuesta dos lineas.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
